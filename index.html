<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <meta charset="UTF-8" />
  <title>Consulta de Associados</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background: #f3f4f6;
      color: #222;
    }

    header {
      background: #003f7f;
      color: white;
      padding: 20px;
    }

    main {
      max-width: 1200px;
      margin: 30px auto;
      padding: 0 16px;
    }

    h1 {
      margin: 0;
      font-size: 24px;
    }

    h2 {
      margin-top: 0;
    }

    .card {
      background: white;
      padding: 20px;
      border-radius: 12px;
      margin-bottom: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 14px;
    }

    label {
      display: block;
      font-weight: bold;
      margin-bottom: 6px;
    }

    input,
    select,
    button {
      width: 100%;
      padding: 10px;
      font-size: 15px;
      box-sizing: border-box;
      border-radius: 6px;
      border: 1px solid #bbb;
    }

    button {
      background: #0057b8;
      color: white;
      border: none;
      cursor: pointer;
      font-weight: bold;
    }

    button:hover {
      background: #004494;
    }

    button:disabled {
      background: #999;
      cursor: not-allowed;
    }

    button.secondary {
      background: #555;
    }

    button.secondary:hover {
      background: #333;
    }

    button.success-button {
      background: #0a7a2f;
    }

    button.success-button:hover {
      background: #075a23;
    }

    button.warning-button {
      background: #b45309;
    }

    button.warning-button:hover {
      background: #92400e;
    }

    .actions {
      margin-top: 18px;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .actions button {
      width: auto;
      min-width: 140px;
    }

    .row-actions {
      display: flex;
      flex-direction: column;
      gap: 8px;
      min-width: 130px;
    }

    .row-actions button {
      font-size: 13px;
      padding: 8px;
    }

    .message {
      margin-top: 12px;
      color: #444;
      white-space: pre-wrap;
    }

    .error {
      color: #b00020;
      font-weight: bold;
    }

    .success {
      color: #0a7a2f;
      font-weight: bold;
    }

    .muted {
      color: #666;
      font-size: 14px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      background: white;
    }

    th,
    td {
      padding: 10px;
      border-bottom: 1px solid #ddd;
      text-align: left;
      vertical-align: middle;
    }

    th {
      background: #e8e8e8;
    }

    td input {
      min-width: 220px;
    }

    .hidden {
      display: none !important;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
    }

    .user-info {
      font-size: 14px;
      opacity: 0.9;
    }

    .status-pill {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 999px;
      font-weight: bold;
      font-size: 13px;
    }

    .estado-pendente {
      background: #fef3c7;
      color: #92400e;
    }

    .estado-enviado {
      background: #dbeafe;
      color: #1d4ed8;
    }

    .estado-recebido {
      background: #dcfce7;
      color: #166534;
    }

    .estado-invalidado {
      background: #fee2e2;
      color: #991b1b;
    }

    .table-wrapper {
      overflow-x: auto;
    }

    .summary {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 14px;
    }

    .summary span {
      background: #f3f4f6;
      border: 1px solid #ddd;
      padding: 8px 12px;
      border-radius: 999px;
    }

    @media (max-width: 850px) {
      .grid {
        grid-template-columns: 1fr;
      }

      table {
        font-size: 14px;
      }

      th,
      td {
        padding: 8px;
      }

      td input {
        min-width: 160px;
      }

      .topbar {
        flex-direction: column;
        align-items: flex-start;
      }

      .actions button {
        width: 100%;
      }
    }
  </style>
</head>

<body>
  <header>
    <div class="topbar">
      <h1>Consulta de Associados</h1>
      <div id="userInfo" class="user-info"></div>
    </div>
  </header>

  <main>
    <section id="loginArea" class="card">
      <h2>Entrar</h2>

      <label for="email">Email</label>
      <input type="email" id="email" placeholder="email@exemplo.pt" />

      <label for="password" style="margin-top: 12px;">Password</label>
      <input type="password" id="password" placeholder="Password" />

      <div class="actions">
        <button id="loginBtn" type="button">Entrar</button>
      </div>

      <div id="loginMessage" class="message"></div>
    </section>

    <section id="appArea" class="hidden">
      <section class="card">
        <h2>Pesquisar associados</h2>

        <div class="grid">
          <div>
            <label for="numeroSocio">Número de sócio</label>
            <input type="text" id="numeroSocio" placeholder="Ex.: 1001" />
          </div>

          <div>
            <label for="nomeCompleto">Nome completo</label>
            <input type="text" id="nomeCompleto" placeholder="Ex.: António Pereira" />
          </div>

          <div>
            <label for="regiao">Região</label>
            <select id="regiao"></select>
          </div>

          <div>
            <label for="contacto">Contacto</label>
            <input
              type="text"
              id="contacto"
              list="contactosExistentes"
              placeholder="Pesquisar ou escolher contacto"
              maxlength="500"
            />

            <datalist id="contactosExistentes"></datalist>
          </div>
        </div>

        <div class="actions">
          <button id="pesquisarBtn" type="button">Pesquisar</button>
          <button id="limparBtn" class="secondary" type="button">Limpar</button>
          <button id="logoutBtn" class="secondary" type="button">Sair</button>
        </div>

        <div id="message" class="message"></div>
      </section>

      <section class="card">
        <div class="table-wrapper">
          <table id="resultTable" class="hidden">
            <thead>
              <tr>
                <th>N.º Sócio</th>
                <th>Nome completo</th>
                <th>Região</th>
                <th>Contacto</th>
                <th>Ação</th>
              </tr>
            </thead>
            <tbody id="resultBody"></tbody>
          </table>
        </div>
      </section>

      <section class="card">
        <h2>Estado dos manifestos</h2>

        <p class="muted">
          A lista não é carregada automaticamente. Escolhe primeiro o estado que queres consultar.
        </p>

        <div class="grid">
          <div>
                     </div>
        </div>

        <div class="actions">
          <button id="manifestosPendentesBtn" type="button">Pendente</button>
          <button id="manifestosEnviadosBtn" type="button">Enviado</button>
          <button id="manifestosRecebidosBtn" class="success-button" type="button">Recebido</button>
          <button id="limparManifestosBtn" class="secondary" type="button">Limpar</button>
          <button id="exportarManifestosBtn" class="secondary" type="button">Exportar CSV</button>
        </div>

        <div id="manifestosMessage" class="message"></div>
        <div id="manifestosSummary" class="summary"></div>

        <div class="table-wrapper" style="margin-top: 16px;">
          <table id="manifestosTable" class="hidden">
            <thead>
              <tr>
                <th>N.º Sócio</th>
                <th>Nome completo</th>
                <th>Estado</th>
                <th>PDF</th>
                <th>Atualizado</th>
                <th>Ações</th>
              </tr>
            </thead>
            <tbody id="manifestosBody"></tbody>
          </table>
        </div>
      </section>
    </section>
  </main>

  <script type="module">

    const BUCKET_MANIFESTOS = "manifestos-assinados";

    preencherDropdown("regiao", REGIOES, "Todas");
    verificarSessao();

    async function verificarSessao() {
      const { data, error } = await supabase.auth.getSession();

      if (error) {
        mostrarLogin("Erro ao verificar sessão.", true);
        return;
      }

      if (data.session) {
        mostrarApp(data.session.user.email);
      } else {
        mostrarLogin();
      }
    }

    async function obterSessaoValida() {
      const { data, error } = await supabase.auth.getSession();

      if (error) {
        throw new Error("Erro ao verificar a sessão.");
      }

      const session = data.session;

      if (!session) {
        throw new Error("Sessão expirada. Volte a iniciar sessão.");
      }

      const agora = Date.now();
      const margemSeguranca = 60 * 1000;

      if (session.expires_at) {
        const expiraEm = session.expires_at * 1000;

        if (agora >= expiraEm - margemSeguranca) {
          const { data: refreshData, error: refreshError } = await supabase.auth.refreshSession();

          if (refreshError || !refreshData.session) {
            await supabase.auth.signOut();
            throw new Error("Sessão expirada. Volte a iniciar sessão.");
          }

          return refreshData.session;
        }
      }

      return session;
    }

    function erroDeSessaoExpirada(error) {
      const texto = String(error?.message || error || "").toLowerCase();

      return (
        texto.includes("jwt expired") ||
        texto.includes("invalid jwt") ||
        texto.includes("session expired") ||
        texto.includes("sessão expirada")
      );
    }

    async function tratarErroSessao(error, elementoMensagem) {
      if (erroDeSessaoExpirada(error)) {
        await supabase.auth.signOut();
        limparPesquisa();
        limparContactosExistentes();
        limparManifestos();
        mostrarLogin("Sessão expirada. Volte a iniciar sessão.", true);
        return true;
      }

      mostrarMensagem(elementoMensagem, error.message || "Erro inesperado.", true);
      return false;
    }

    async function login() {
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;

      loginMessage.textContent = "";
      loginMessage.className = "message";

      if (!email || !password) {
        mostrarMensagem(loginMessage, "Preencha email e password.", true);
        return;
      }

      const { data, error } = await supabase.auth.signInWithPassword({
        email,
        password
      });

      if (error) {
        console.error("Erro de login:", error);
        mostrarMensagem(loginMessage, "Login inválido ou utilizador sem autorização.", true);
        return;
      }

      mostrarApp(data.user.email);
    }

    async function logout() {
      await supabase.auth.signOut();
      limparPesquisa();
      limparContactosExistentes();
      limparManifestos();
      mostrarLogin();
    }

    async function pesquisar() {
      try {
        await obterSessaoValida();

        limparResultados();

        const numeroSocio = document.getElementById("numeroSocio").value.trim();
        const nomeCompleto = document.getElementById("nomeCompleto").value.trim();
        const regiao = document.getElementById("regiao").value.trim();
        const contacto = document.getElementById("contacto").value.trim();

        if (!numeroSocio && !nomeCompleto && !regiao && !contacto) {
          mostrarMensagem(message, "Preencha pelo menos um campo para pesquisar.", true);
          return;
        }

        mostrarMensagem(message, "A pesquisar...", false);

        const { data, error } = await supabase.rpc("pesquisar_associados", {
          p_numero_socio: numeroSocio || null,
          p_nome_completo: nomeCompleto || null,
          p_regiao: regiao || null,
          p_contacto: contacto || null
        });

        if (error) {
          throw error;
        }

        if (!data || data.length === 0) {
          mostrarMensagem(message, "Não foram encontrados resultados.", false);
          return;
        }

        data.forEach(criarLinhaResultado);

        resultTable.classList.remove("hidden");
        mostrarMensagem(message, `${data.length} resultado(s) encontrado(s).`, false);
      } catch (error) {
        console.error("Erro ao pesquisar:", error);

        const erroTratado = await tratarErroSessao(error, message);

        if (!erroTratado) {
          mostrarMensagem(message, error.message || "Erro ao pesquisar.", true);
        }
      }
    }

    function criarLinhaResultado(associado) {
  const tr = document.createElement("tr");

  const tdNumero = document.createElement("td");
  tdNumero.textContent = associado.numero_socio ?? "";

  const tdNome = document.createElement("td");
  tdNome.textContent = associado.nome_completo ?? "";

  const tdRegiao = document.createElement("td");
  tdRegiao.textContent = associado.regiao ?? "";

  const tdContacto = document.createElement("td");

  const inputContacto = document.createElement("input");
  inputContacto.type = "text";
  inputContacto.id = `contacto-${associado.id}`;
  inputContacto.value = associado.contacto ?? "";
  inputContacto.placeholder = "Escrever ou escolher contacto";
  inputContacto.maxLength = 500;
  inputContacto.setAttribute("list", "contactosExistentes");

  tdContacto.appendChild(inputContacto);

  const tdAcao = document.createElement("td");

  const divAcoes = document.createElement("div");
  divAcoes.className = "row-actions";

  const guardarBtn = document.createElement("button");
  guardarBtn.type = "button";
  guardarBtn.textContent = "Guardar";
  guardarBtn.addEventListener("click", () =>
    guardarContacto(associado.id)
  );

  const pdfBtn = document.createElement("button");
  pdfBtn.type = "button";
  pdfBtn.textContent = "Gerar PDF";
  pdfBtn.className = "secondary";

  pdfBtn.addEventListener("click", () =>
    gerarPDFProponente(associado, tdAcao)
  );

  divAcoes.appendChild(guardarBtn);
  divAcoes.appendChild(pdfBtn);

  tdAcao.appendChild(divAcoes);

  tr.appendChild(tdNumero);
  tr.appendChild(tdNome);
  tr.appendChild(tdRegiao);
  tr.appendChild(tdContacto);
  tr.appendChild(tdAcao);

  resultBody.appendChild(tr);
}
    async function guardarContacto(id) {
      try {
        await obterSessaoValida();

        const input = document.getElementById(`contacto-${id}`);

        if (!input) {
          throw new Error("Campo de contacto não encontrado.");
        }

        const novoContacto = input.value.trim();

        const { error } = await supabase.rpc("atualizar_contacto_associado", {
          p_id: id,
          p_contacto: novoContacto
        });

        if (error) {
          throw error;
        }

        await carregarContactosExistentes();

        mostrarMensagem(message, "Contacto atualizado com sucesso.", false, true);
      } catch (error) {
        console.error("Erro ao guardar contacto:", error);

        const erroTratado = await tratarErroSessao(error, message);

        if (!erroTratado) {
          mostrarMensagem(message, error.message || "Erro ao guardar contacto.", true);
        }
      }
    }

   async function gerarPDFProponente(associado, tdAcao) {
  try {
    await obterSessaoValida();

    const nome = associado.nome_completo ?? "";
    const numeroSocio = associado.numero_socio ?? "";
    const associadoId = associado.id;

    if (!nome || !numeroSocio || !associadoId) {
      mostrarMensagem(
        message,
        "Não é possível gerar o manifesto sem nome, número de sócio e identificador do associado.",
        true
      );
      return;
    }

   const candidatura = "candidatura-2025";
    
    mostrarMensagem(
      message,
      "A preparar manifesto...",
      false
    );

    /*
     * Criar ou recuperar o manifesto existente.
     *
     * Se já existir um manifesto para este associado e candidatura,
     * o RPC devolve o mesmo token.
     */
    const { data: manifesto, error: manifestoError } =
      await supabase.rpc("criar_manifesto_assinatura", {
        p_associado_id: associadoId,
        p_candidatura: candidatura
      });

    if (manifestoError) {
      throw manifestoError;
    }

    if (!manifesto || !manifesto.token) {
      throw new Error(
        "Não foi possível criar ou recuperar o token do manifesto."
      );
    }

    mostrarMensagem(
      message,
      "A gerar PDF...",
      false
    );

    /*
     * Carregar o modelo PDF.
     */
    const response = await fetch(
      "manifesto_proponentes_modelo.pdf"
    );

    if (!response.ok) {
      throw new Error(
        "Não foi possível carregar o ficheiro manifesto_proponentes_modelo.pdf."
      );
    }

    const modeloBytes = await response.arrayBuffer();

    const pdfDoc = await PDFDocument.load(modeloBytes);
    const form = pdfDoc.getForm();

    const campoNome = form.getTextField("proponente_nome");
    const campoSocio = form.getTextField("proponente_socio");

    campoNome.setText(String(nome));
    campoSocio.setText(String(numeroSocio));

    campoNome.enableReadOnly();
    campoSocio.enableReadOnly();

    form.flatten();

    const pdfBytes = await pdfDoc.save();

    /*
     * Descarregar o PDF.
     */
const blob = new Blob([pdfBytes], {
  type: "application/pdf"
});

const url = URL.createObjectURL(blob);

// Abrir o PDF numa nova página/aba
window.open(url, "_blank");

    /*
     * Criar o link persistente para upload.
     */
    const linkUpload = criarLinkUpload(
      manifesto.token
    );

    mostrarMensagem(
      message,
      "Manifesto gerado com sucesso.\n\n" +
      "Link para envio do manifesto assinado:\n" +
      linkUpload,
      false,
      true
    );

    /*
     * Mostrar ações do manifesto.
     */
   mostrarAcoesManifesto(
  manifesto.token,
  manifesto.estado,
  manifesto.pdf_assinado_path,
  tdAcao
);

  } catch (error) {
    console.error(
      "Erro ao gerar manifesto:",
      error
    );

    const erroTratado =
      await tratarErroSessao(
        error,
        message
      );

    if (!erroTratado) {
      mostrarMensagem(
        message,
        error.message ||
          "Erro ao gerar manifesto.",
        true
      );
    }
  }
}

    function criarNomeFicheiroPDF(nome, numeroSocio) {
      const nomeLimpo = String(nome)
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .replace(/[^a-zA-Z0-9]+/g, "_")
        .replace(/^_+|_+$/g, "")
        .toLowerCase();

      const numeroSocioLimpo = String(numeroSocio)
        .replace(/[^a-zA-Z0-9]+/g, "_")
        .replace(/^_+|_+$/g, "");

      return `proponente_${numeroSocioLimpo}_${nomeLimpo}.pdf`;
    }

    async function carregarContactosExistentes() {
      try {
        await obterSessaoValida();

        const { data, error } = await supabase.rpc("listar_contactos_distintos");

        if (error) {
          throw error;
        }

        const datalist = document.getElementById("contactosExistentes");
        datalist.innerHTML = "";

        if (!data) {
          return;
        }

        data.forEach(item => {
          if (!item.valor) {
            return;
          }

          const option = document.createElement("option");
          option.value = item.valor;
          datalist.appendChild(option);
        });
      } catch (error) {
        console.error("Erro ao carregar contactos existentes:", error);

        if (erroDeSessaoExpirada(error)) {
          await supabase.auth.signOut();
          limparContactosExistentes();
          mostrarLogin("Sessão expirada. Volte a iniciar sessão.", true);
        }
      }
    }
function criarLinkUpload(token) {
  if (!token) {
    return "";
  }

  const baseUrl =
    window.location.origin +
    window.location.pathname.replace(
      /index\.html$/i,
      ""
    );

  return (
    baseUrl +
    UPLOAD_PAGE +
    "?token=" +
    encodeURIComponent(token)
  );
}
    function mostrarAcoesManifesto(
  token,
  estado,
  pdfAssinadoPath,
  tdAcao
) {
  if (!tdAcao || !token) return;

  // Procurar uma área de acções do manifesto já existente
  let manifestoActions = tdAcao.querySelector(".manifesto-actions");

  if (!manifestoActions) {
    manifestoActions = document.createElement("div");
    manifestoActions.className = "manifesto-actions";
    manifestoActions.style.marginTop = "8px";
    manifestoActions.style.display = "flex";
    manifestoActions.style.flexWrap = "wrap";
    manifestoActions.style.gap = "6px";

    tdAcao.appendChild(manifestoActions);
  }

  // Limpar botões anteriores
  manifestoActions.innerHTML = "";

  const copiarBtn = document.createElement("button");
  copiarBtn.type = "button";
  copiarBtn.textContent = "Copiar link";
  copiarBtn.addEventListener("click", () => {
    copiarLinkUpload(token);
  });

  const abrirBtn = document.createElement("button");
  abrirBtn.type = "button";
  abrirBtn.textContent = "Abrir link";
  abrirBtn.className = "secondary";

  abrirBtn.addEventListener("click", () => {
    const link = criarLinkUpload(token);
    window.open(link, "_blank");
  });

  manifestoActions.appendChild(copiarBtn);
  manifestoActions.appendChild(abrirBtn);

  if (pdfAssinadoPath) {
    const pdfBtn = document.createElement("button");
    pdfBtn.type = "button";
    pdfBtn.textContent = "Baixar PDF assinado";
    pdfBtn.className = "success-button";

    pdfBtn.addEventListener("click", () => {
      descarregarPDFManifesto(pdfAssinadoPath);
    });

    manifestoActions.appendChild(pdfBtn);
  }
}
    function limparContactosExistentes() {
      const datalist = document.getElementById("contactosExistentes");
      datalist.innerHTML = "";
    }

    function limparPesquisa() {
      document.getElementById("numeroSocio").value = "";
      document.getElementById("nomeCompleto").value = "";
      document.getElementById("regiao").value = "";
      document.getElementById("contacto").value = "";

      limparResultados();

      message.textContent = "";
      message.className = "message";
    }

    function limparResultados() {
      resultBody.innerHTML = "";
      resultTable.classList.add("hidden");
    }

    function preencherDropdown(id, valores, textoInicial) {
      const select = document.getElementById(id);
      select.innerHTML = "";

      const optionInicial = document.createElement("option");
      optionInicial.value = "";
      optionInicial.textContent = textoInicial;
      select.appendChild(optionInicial);

      valores.forEach(valor => {
        const option = document.createElement("option");
        option.value = valor;
        option.textContent = valor;
        select.appendChild(option);
      });
    }

    function mostrarApp(email) {
      loginArea.classList.add("hidden");
      appArea.classList.remove("hidden");
      userInfo.textContent = `Sessão iniciada: ${email}`;

      carregarContactosExistentes();

      /*
        Importante:
        Os manifestos NÃO são carregados aqui automaticamente.
        Só serão carregados quando clicar em Pendente, Enviado ou Recebido.
      */
      limparManifestos();
    }

    function mostrarLogin(textoErro = "", erro = false) {
      appArea.classList.add("hidden");
      loginArea.classList.remove("hidden");
      userInfo.textContent = "";

      if (textoErro) {
        mostrarMensagem(loginMessage, textoErro, erro);
      } else {
        loginMessage.textContent = "";
        loginMessage.className = "message";
      }
    }

    function mostrarMensagem(elemento, texto, erro = false, sucesso = false) {
      elemento.textContent = texto;
      elemento.className = "message";

      if (erro) {
        elemento.classList.add("error");
      }

      if (sucesso) {
        elemento.classList.add("success");
      }
    }

    async function carregarManifestosPorEstado(estado) {
      try {
        await obterSessaoValida();

        estadoManifestosAtual = estado;
        manifestosAtuais = [];

        manifestosBody.innerHTML = "";
        manifestosSummary.innerHTML = "";
        manifestosTable.classList.add("hidden");

       const candidatura = "candidatura-2025";

        mostrarMensagem(manifestosMessage, `A carregar manifestos com estado "${estado}"...`, false);

        const { data, error } = await supabase.rpc("listar_estado_manifestos", {
          p_candidatura: candidatura
        });

        if (error) {
          throw error;
        }

const lista = Array.isArray(data) ? data : [];

console.log("Manifestos recebidos pela aplicação:", lista);
console.log("Estado selecionado:", estado);
console.log(
  "Estados existentes:",
  [...new Set(lista.map(item => item.estado))]
);

console.table(
  lista
    .filter(item => item.estado === "recebido")
    .map(item => ({
      numero: item.numero_socio,
      nome: item.nome_completo,
      estado: item.estado,
      pdf: item.pdf_assinado_path
    }))
);
        
        manifestosAtuais = lista.filter(item => item.estado === estado);

        if (manifestosAtuais.length === 0) {
          mostrarMensagem(manifestosMessage, `Não existem manifestos com estado "${estado}".`, false);
          atualizarResumoManifestos([]);
          return;
        }

        manifestosAtuais.forEach(criarLinhaManifesto);

        manifestosTable.classList.remove("hidden");
        atualizarResumoManifestos(manifestosAtuais);

        mostrarMensagem(
          manifestosMessage,
          `${manifestosAtuais.length} manifesto(s) com estado "${estado}" encontrado(s).`,
          false,
          true
        );
      } catch (error) {
        console.error("Erro ao carregar manifestos:", error);

        const erroTratado = await tratarErroSessao(error, manifestosMessage);

        if (!erroTratado) {
          mostrarMensagem(
            manifestosMessage,
            error.message || "Erro ao carregar manifestos.",
            true
          );
        }
      }
    }

    function criarLinhaManifesto(item) {
      const tr = document.createElement("tr");

      const tdNumero = document.createElement("td");
      tdNumero.textContent = item.numero_socio ?? "";

      const tdNome = document.createElement("td");
      tdNome.textContent = item.nome_completo ?? "";

      const tdEstado = document.createElement("td");
      const pill = document.createElement("span");
      pill.className = `status-pill estado-${item.estado || ""}`;
      pill.textContent = item.estado ?? "";
      tdEstado.appendChild(pill);

      const tdPdf = document.createElement("td");
      tdPdf.textContent = item.pdf_assinado_path ? "Disponível" : "—";

      const tdAtualizado = document.createElement("td");
      tdAtualizado.textContent = formatarData(
        item.atualizado_em || item.recebido_em || item.enviado_em || item.criado_em
      );

      const tdAcoes = document.createElement("td");
      const divAcoes = document.createElement("div");
      divAcoes.className = "row-actions";

      const copiarBtn = document.createElement("button");
      copiarBtn.type = "button";
      copiarBtn.textContent = "Copiar link";
      copiarBtn.addEventListener("click", () => copiarLinkUpload(item.token));

      const downloadBtn = document.createElement("button");
      downloadBtn.type = "button";
      downloadBtn.textContent = "Baixar PDF";
      downloadBtn.className = "success-button";
      downloadBtn.disabled = !item.pdf_assinado_path;
      downloadBtn.addEventListener("click", () => descarregarPDFManifesto(item.pdf_assinado_path));

      divAcoes.appendChild(copiarBtn);
      divAcoes.appendChild(downloadBtn);

      tdAcoes.appendChild(divAcoes);

      tr.appendChild(tdNumero);
      tr.appendChild(tdNome);
      tr.appendChild(tdEstado);
      tr.appendChild(tdPdf);
      tr.appendChild(tdAtualizado);
      tr.appendChild(tdAcoes);

      manifestosBody.appendChild(tr);
    }

    function atualizarResumoManifestos(lista) {
      manifestosSummary.innerHTML = "";

      const span = document.createElement("span");

      if (!estadoManifestosAtual) {
        span.textContent = "Nenhum filtro selecionado";
      } else {
        span.textContent = `${estadoManifestosAtual}: ${lista.length}`;
      }

      manifestosSummary.appendChild(span);
    }

    function limparManifestos() {
      manifestosAtuais = [];
      estadoManifestosAtual = "";
      manifestosBody.innerHTML = "";
      manifestosSummary.innerHTML = "";
      manifestosTable.classList.add("hidden");
      manifestosMessage.textContent = "Escolha Pendente, Enviado ou Recebido para consultar.";
      manifestosMessage.className = "message";
    }

    async function copiarLinkUpload(token) {
  if (!token) {
    mostrarMensagem(
      manifestosMessage,
      "Este manifesto não tem token.",
      true
    );
    return;
  }

  const baseUrl =
    window.location.origin +
    window.location.pathname.replace(/index\.html$/i, "");

  const link =
    baseUrl +
    UPLOAD_PAGE +
    "?token=" +
    encodeURIComponent(token);

  try {
    await navigator.clipboard.writeText(link);

    mostrarMensagem(
      manifestosMessage,
      "Link copiado:\n" + link,
      false,
      true
    );
  } catch (error) {
    console.error("Erro ao copiar link:", error);

    mostrarMensagem(
      manifestosMessage,
      "Não foi possível copiar automaticamente o link.",
      true
    );
  }
}

async function descarregarPDFManifesto(path) {
  try {
    if (!path) {
      throw new Error("Este manifesto não tem PDF associado.");
    }

    await obterSessaoValida();

    mostrarMensagem(
      manifestosMessage,
      "A preparar o PDF...",
      false
    );

    const { data, error } = await supabase.storage
      .from(BUCKET_MANIFESTOS)
      .createSignedUrl(path, 300);

    if (error) {
      throw error;
    }

    if (!data?.signedUrl) {
      throw new Error("Não foi possível gerar o link do PDF.");
    }

    window.open(data.signedUrl, "_blank");

    mostrarMensagem(
      manifestosMessage,
      "PDF preparado.",
      false,
      true
    );
  } catch (error) {
    console.error("Erro ao descarregar PDF:", error);

    const erroTratado = await tratarErroSessao(
      error,
      manifestosMessage
    );

    if (!erroTratado) {
      mostrarMensagem(
        manifestosMessage,
        error.message || "Erro ao descarregar PDF.",
        true
      );
    }
  }
}

function formatarData(valor) {
  if (!valor) {
    return "—";
  }

  const data = new Date(valor);

  if (Number.isNaN(data.getTime())) {
    return String(valor);
  }

  return data.toLocaleString("pt-PT", {
    dateStyle: "short",
    timeStyle: "short"
  });
}

function escaparCSV(valor) {
  const texto = String(valor ?? "");

  return `"${texto.replace(/"/g, '""')}"`;
}

function exportarManifestosCSV() {
  if (!manifestosAtuais.length) {
    mostrarMensagem(
      manifestosMessage,
      "Não existem manifestos carregados para exportar.",
      true
    );
    return;
  }

  const cabecalho = [
    "Número de sócio",
    "Nome completo",
    "Estado",
    "PDF",
    "Token",
    "Atualizado"
  ];

  const linhas = manifestosAtuais.map(item => [
    item.numero_socio ?? "",
    item.nome_completo ?? "",
    item.estado ?? "",
    item.pdf_assinado_path ? "Disponível" : "",
    item.token ?? "",
    formatarData(
      item.atualizado_em ||
      item.recebido_em ||
      item.enviado_em ||
      item.criado_em
    )
  ]);

  const csv = [
    cabecalho.map(escaparCSV).join(";"),
    ...linhas.map(linha =>
      linha.map(escaparCSV).join(";")
    )
  ].join("\r\n");

  const blob = new Blob(
    ["\uFEFF" + csv],
    {
      type: "text/csv;charset=utf-8;"
    }
  );

  const url = URL.createObjectURL(blob);

  const link = document.createElement("a");
  link.href = url;

const candidatura = "candidatura-2025";

  link.download =
    `manifestos_${candidatura}_${estadoManifestosAtual || "todos"}.csv`;

  document.body.appendChild(link);
  link.click();
  link.remove();

  setTimeout(() => {
    URL.revokeObjectURL(url);
  }, 1000);

  mostrarMensagem(
    manifestosMessage,
    "CSV exportado com sucesso.",
    false,
    true
  );
}

  </script>
