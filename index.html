<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <meta charset="UTF-8" />
  <title>Consulta de Associados</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background: #f3f4f6;
      color: #222;
    }

    header {
      background: #003f7f;
      color: white;
      padding: 20px;
    }

    main {
      max-width: 1200px;
      margin: 30px auto;
      padding: 0 16px;
    }

    h1 {
      margin: 0;
      font-size: 24px;
    }

    .card {
      background: white;
      padding: 20px;
      border-radius: 12px;
      margin-bottom: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 14px;
    }

    label {
      display: block;
      font-weight: bold;
      margin-bottom: 6px;
    }

    input,
    select,
    button {
      width: 100%;
      padding: 10px;
      font-size: 15px;
      box-sizing: border-box;
      border-radius: 6px;
      border: 1px solid #bbb;
    }

    button {
      background: #0057b8;
      color: white;
      border: none;
      cursor: pointer;
      font-weight: bold;
    }

    button:hover {
      background: #004494;
    }

    button.secondary {
      background: #555;
    }

    button.secondary:hover {
      background: #333;
    }

    button.success-button {
      background: #0a7a2f;
    }

    button.success-button:hover {
      background: #075a23;
    }

    button.warning-button {
      background: #b45309;
    }

    button.warning-button:hover {
      background: #92400e;
    }

    .actions {
      margin-top: 18px;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .actions button {
      width: auto;
      min-width: 140px;
    }

    .row-actions {
      display: flex;
      flex-direction: column;
      gap: 8px;
      min-width: 160px;
    }

    .row-actions button {
      font-size: 13px;
      padding: 8px;
    }

    .message {
      margin-top: 12px;
      color: #444;
    }

    .error {
      color: #b00020;
    }

    .success {
      color: #0a7a2f;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      background: white;
    }

    th,
    td {
      padding: 10px;
      border-bottom: 1px solid #ddd;
      text-align: left;
      vertical-align: middle;
    }

    th {
      background: #e8e8e8;
    }

    td input {
      min-width: 220px;
    }

    .hidden {
      display: none;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
    }

    .user-info {
      font-size: 14px;
      opacity: 0.9;
    }

    .summary {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin: 14px 0;
    }

      background: #f3f4f6;
      border: 1px solid #ddd;
      padding: 8px 12px;
      border
